name: "Box Integration Test"

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    box-integration:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            - name: "Install rust toolchain"
              run: |
                  rustup toolchain install
                  rustup show

            - name: "Build carrier"
              run: cargo build --release --locked -p carrier

            - name: "Set up R"
              uses: r-lib/actions/setup-r@v2
              with:
                  use-public-rspm: true

            - name: "Install the patched {box} fork"
              run: |
                  Rscript -e 'install.packages("pak")'
                  Rscript -e 'pak::pak("joshuamarie/box@carrier-module-support")'

            - name: "Install a real module via carrier"
              shell: bash
              run: |
                  if [ "${{ runner.os }}" = "Windows" ]; then
                      ./target/release/carrier.exe install gh:joshuamarie/fpurrr --install-deps
                  else
                      ./target/release/carrier install gh:joshuamarie/fpurrr --install-deps
                  fi

            - name: "Verify box::use() resolves the installed module"
              shell: bash
              run: |
                  Rscript -e '
                  box::use(
                      fp = fpurrr, 
                      fpurrr/map, 
                  )

                  cat("== fp$map$call(1:5, sqrt) ==\n")
                  print(fp$map$call(1:5, sqrt))

                  cat("\n== map$call(1:5, sqrt) (submodule imported directly) ==\n")
                  print(map$call(1:5, sqrt))

                  cat("\n== fp$map$call@dbl(1:5, sqrt) (typed dispatch) ==\n")
                  print(fp$map$call@dbl(1:5, sqrt))

                  stopifnot(identical(fp$map$call@dbl(1:5, sqrt), sqrt(1:5)))
                  cat("\n\nbox successfully imported the carrier-installed module.\n")
                  '
