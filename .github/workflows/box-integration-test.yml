name: "Box Integration Test"

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    box-integration:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v4

            - name: "Install rust toolchain"
              run: |
                  rustup toolchain install
                  rustup show

            - name: "Build carrier"
              run: cargo build --release --locked -p carrier

            - name: "Set up R"
              uses: r-lib/actions/setup-r@v2
              with:
                  use-public-rspm: true

            - name: "Install the patched {box} fork"
              run: |
                  Rscript -e 'install.packages("pak")'
                  Rscript -e 'pak::pak("joshuamarie/box@carrier-module-support")'

            - name: "Install a real module via carrier"
              run: ./target/release/carrier install gh:joshuamarie/fpurrr --install-deps

            - name: "Verify box::use() resolves the installed module"
              run: |
                  Rscript -e '
                  box::use(fp = fpurrr, fpurrr/map)
                  stopifnot(identical(fp$map$call@dbl(1:3, sqrt), sqrt(1:3)))
                  cat("box successfully imported the carrier-installed module.\n")
                  '
