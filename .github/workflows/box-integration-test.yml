name: "Box Integration Test"

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    box-integration:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            - name: "Install rust toolchain"
              run: |
                  rustup toolchain install
                  rustup show

            - name: "Build carrier"
              run: cargo build --release --locked -p carrier

            - name: "Set up R"
              uses: r-lib/actions/setup-r@v2
              with:
                  use-public-rspm: true

            - name: "Install the patched {box} fork"
              run: |
                  Rscript -e 'install.packages("pak")'
                  Rscript -e 'pak::pak("joshuamarie/box@carrier-module-support")'

            - name: "Fetch fpurrr"
              run: git clone --depth 1 https://github.com/joshuamarie/fpurrr.git fpurrr-src

            - name: "Install a real module via carrier"
              shell: bash
              run: |
                  if [ "${{ runner.os }}" = "Windows" ]; then
                      ./target/release/carrier.exe install ./fpurrr-src --install-deps
                  else
                      ./target/release/carrier install ./fpurrr-src --install-deps
                  fi

            - name: "Diagnose lib paths (windows)"
              if: runner.os == 'Windows'
              shell: bash
              run: |
                  Rscript -e 'cat(.libPaths(), sep="\n")'
                  echo "TEMP=$TEMP"
                  echo "RUNNER_TEMP=$RUNNER_TEMP"

            - name: "Load each installed package individually (windows only)"
              if: runner.os == 'Windows'
              shell: bash
              run: |
                  Rscript -e '
                  cat("R STARTED\n"); flush(stdout())
                  lib = "D:/a/_temp/Library"
                  pkgs = list.dirs(lib, recursive = FALSE, full.names = FALSE)
                  cat("found", length(pkgs), "packages\n"); flush(stdout())
                  for (p in pkgs) {
                      cat("loading", p, "...\n"); flush(stdout())
                      loadNamespace(p, lib.loc = lib)
                      cat("  ok\n"); flush(stdout())
                  }
                  '
            
            - name: "Verify box::use() resolves the installed module"
              shell: bash
              run: |
                  Rscript -e '
                  cat("about to call box::use()\n"); flush(stdout())
                  box::use(
                      fp = fpurrr, 
                      fpurrr/map, 
                  )
                  
                  cat("box::use() returned\n"); flush(stdout())

                  cat("== fp$map$call(1:5, sqrt) ==\n"); flush(stdout())
                  print(fp$map$call(1:5, sqrt))

                  cat("\n== map$call(1:5, sqrt) (submodule imported directly) ==\n"); flush(stdout())
                  print(map$call(1:5, sqrt))

                  cat("\n== fp$map$call@dbl(1:5, sqrt) (typed dispatch) ==\n"); flush(stdout())
                  print(fp$map$call@dbl(1:5, sqrt))

                  stopifnot(identical(fp$map$call@dbl(1:5, sqrt), sqrt(1:5)))
                  cat("\n\nbox successfully imported the carrier-installed module.\n")
                  '
