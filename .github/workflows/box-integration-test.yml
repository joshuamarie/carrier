name: "Box Integration Test"

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    box-integration:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            - name: "Install rust toolchain"
              run: |
                  rustup toolchain install
                  rustup show

            - name: "Build carrier"
              run: cargo build --release --locked -p carrier

            - name: "Set up R"
              uses: r-lib/actions/setup-r@v2
              with:
                  r-version: "4.5.2"
                  use-public-rspm: true

            - name: "Install the patched {box} fork"
              run: |
                  Rscript -e 'install.packages("pak")'
                  Rscript -e 'pak::pak("joshuamarie/box@feature/carrier-module-support")'

            - name: "Fetch fpurrr"
              run: git clone --depth 1 https://github.com/joshuamarie/fpurrr.git fpurrr-src

            - name: "Install a real module via carrier"
              shell: bash
              run: |
                  if [ "${{ runner.os }}" = "Windows" ]; then
                      ./target/release/carrier.exe install ./fpurrr-src --install-deps
                  else
                      ./target/release/carrier install ./fpurrr-src --install-deps
                  fi

            - name: "Verify box::use() resolves the installed module"
              run: Rscript scripts/verify-box-use.R
